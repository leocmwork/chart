<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Bankroll Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --bg-color: #0b0f17;
      --card-bg: rgba(22, 30, 46, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --accent-green: #10b981;
      --accent-green-glow: rgba(16, 185, 129, 0.3);
      --accent-red: #f43f5e;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --border-color: #1e293b;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      margin: 0;
      padding: 24px 16px;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    /* STATS DASHBOARD */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 18px 20px;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .stat-box:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stat-value {
      font-size: 1.85rem;
      font-weight: 800;
      margin-top: 6px;
      letter-spacing: -0.02em;
    }

    .positive { color: var(--accent-green); text-shadow: 0 0 20px var(--accent-green-glow); }
    .negative { color: var(--accent-red); }

    /* CHART CONTAINER */
    .chart-hero {
      position: relative;
      height: 440px;
      width: 100%;
    }

    h2 { 
      margin-top: 0; 
      font-size: 1.15rem; 
      font-weight: 700;
      color: var(--text-main); 
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    input, select {
      background-color: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent-blue);
    }

    button {
      background-color: var(--accent-blue);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover { 
      opacity: 0.95; 
      transform: translateY(-1px);
    }

    .btn-submit {
      grid-column: 1 / -1;
      margin-top: 10px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.39);
    }

    .btn-cancel {
      grid-column: 1 / -1;
      background-color: var(--border-color);
      display: none;
    }

    .btn-action {
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 6px;
      margin-right: 4px;
    }

    .btn-edit { background-color: var(--accent-purple); color: #fff; }
    .btn-delete { background-color: rgba(244, 63, 94, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    th, td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid var(--card-border);
    }

    th { 
      color: var(--text-muted); 
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="card">
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Total Hours</div>
          <div class="stat-value" id="statHoras">0.0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Total Profit</div>
          <div class="stat-value" id="statBeneficio">$0.00</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Winrate ($/h)</div>
          <div class="stat-value" id="statWinrate">$0.00/h</div>
        </div>
      </div>

      <div class="chart-hero" id="chartHeroArea">
        <canvas id="bankrollChart"></canvas>
      </div>
    </div>

    <div class="card">
      <h2 id="formTitle">📝 Log Session</h2>
      <form id="pokerForm" class="form-grid">
        <input type="hidden" id="editIndex" value="-1">
        <div class="form-group">
          <label>Session Date</label>
          <input type="date" id="fecha" required>
        </div>
        <div class="form-group">
          <label>Session Name / ID</label>
          <input type="text" id="nombre" placeholder="e.g. NL50 / PLO6" required>
        </div>
        <div class="form-group">
          <label>Stakes / Level</label>
          <input type="text" id="stake" placeholder="e.g. 0.25/0.50" required>
        </div>
        <div class="form-group">
          <label>Hours Played</label>
          <input type="number" step="0.1" id="horas" placeholder="2.5" required>
        </div>
        <div class="form-group">
          <label>Result ($)</label>
          <input type="number" step="0.01" id="resultado" placeholder="+150 or -50" required>
        </div>
        <div class="form-group" style="grid-column: 1 / -1;">
          <label>Notes / Remarks</label>
          <input type="text" id="observaciones" placeholder="Session notes...">
        </div>
        <button type="submit" id="btnSave" class="btn-submit">Save Session</button>
        <button type="button" id="btnCancel" class="btn-cancel" onclick="resetForm()">Cancel Edit</button>
      </form>
    </div>
