<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Bankroll Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #121824;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-yellow: #f59e0b;
      --border-color: #334155;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .status-badge {
      font-size: 0.85rem;
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--accent-green);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--accent-green);
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }

    /* CHART HERO CONTAINER */
    .chart-hero {
      position: relative;
      height: 420px;
      width: 100%;
      margin-top: 15px;
    }

    h2 { margin-top: 0; font-size: 1.25rem; color: var(--text-main); }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    input, select, textarea {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: white;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    button {
      background-color: var(--accent-blue);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { opacity: 0.9; }

    .btn-submit {
      grid-column: 1 / -1;
      margin-top: 10px;
      background-color: var(--accent-green);
    }

    .btn-cancel {
      grid-column: 1 / -1;
      background-color: var(--border-color);
      display: none;
    }

    .btn-action {
      padding: 5px 10px;
      font-size: 0.8rem;
      border-radius: 4px;
      margin-right: 4px;
    }

    .btn-edit { background-color: var(--accent-yellow); color: #000; }
    .btn-delete { background-color: var(--accent-red); }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-box {
      background-color: var(--bg-color);
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
      margin-top: 5px;
    }

    .positive { color: var(--accent-green); }
    .negative { color: var(--accent-red); }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    th { color: var(--text-muted); background-color: rgba(0,0,0,0.2); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1 style="margin:0; font-size:1.6rem;">Poker Cash Tracker</h1>
        <small style="color:var(--text-muted)">Cloud-synced session tracking</small>
      </div>
      <div>
        <span class="status-badge" id="syncStatus">✅ Synced</span>
        <button id="btnReload" onclick="loadSessions()" style="font-size:0.8rem; margin-left:8px;">🔄 Reload</button>
      </div>
    </header>

    <!-- 1. HERO CHART & STATS FIRST -->
    <div class="card">
      <h2>Bankroll Progression</h2>
      
      <div class="stats-grid">
        <div class="stat-box">
          <label>Total Sessions</label>
          <div class="stat-value" id="statSesiones">0</div>
        </div>
        <div class="stat-box">
          <label>Total Hours</label>
          <div class="stat-value" id="statHoras">0.0</div>
        </div>
        <div class="stat-box">
          <label>Total Profit</label>
          <div class="stat-value" id="statBeneficio">$0.00</div>
        </div>
        <div class="stat-box">
          <label>Winrate ($/h)</label>
          <div class="stat-value" id="statWinrate">$0.00/h</div>
        </div>
      </div>

      <div class="chart-hero">
        <canvas id="bankrollChart"></canvas>
      </div>
    </div>

    <!-- 2. SESSION FORM BELOW -->
    <div class="card">
      <h2 id="formTitle">Log Session</h2>
      <form id="pokerForm" class="form-grid">
        <input type="hidden" id="editIndex" value="-1">
        <div class="form-group">
          <label>Session Date</label>
          <input type="date" id="fecha" required>
        </div>
        <div class="form-group">
          <label>Session Name / ID</label>
          <input type="text" id="nombre" placeholder="e.g. NL50 / PLO6" required>
        </div>
        <div class="form-group">
          <label>Stakes / Level</label>
          <input type="text" id="stake" placeholder="e.g. 0.25/0.50" required>
        </div>
        <div class="form-group">
          <label>Hours Played</label>
          <input type="number" step="0.1" id="horas" placeholder="2.5" required>
        </div>
        <div class="form-group">
          <label>Result ($)</label>
          <input type="number" step="0.01" id="resultado" placeholder="+150 or -50" required>
        </div>
        <div class="form-group" style="grid-column: 1 / -1;">
          <label>Notes / Remarks</label>
          <input type="text" id="observaciones" placeholder="Session notes...">
        </div>
        <button type="submit" id="btnSave" class="btn-submit">Save Session</button>
        <button type="button" id="btnCancel" class="btn-cancel" onclick="resetForm()">Cancel Edit</button>
      </form>
    </div>

    <!-- 3. HISTORY TABLE LAST -->
    <div class="card">
      <h2>Session History</h2>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Session</th>
              <th>Stakes</th>
              <th>Hours</th>
              <th>Result</th>
              <th>Notes</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tablaHistorial">
            <tr><td colspan="7" style="text-align:center;">No sessions recorded yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw5XuWVdqvhCaUFdJmc8a_Ag6yXQIHrbZ0LZYjJ2csgiESlmzfuydadVJqiviNq5cOyvA/exec";

    let chartInstance = null;
    let sesionesData = [];

    document.getElementById('fecha').valueAsDate = new Date();

    // Save or Update Session
    document.getElementById('pokerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const editIndex = parseInt(document.getElementById('editIndex').value);
      const sessionObj = {
        fecha: document.getElementById('fecha').value,
        nombre: document.getElementById('nombre').value,
        stake: document.getElementById('stake').value,
        horas: parseFloat(document.getElementById('horas').value),
        resultado: parseFloat(document.getElementById('resultado').value),
        observaciones: document.getElementById('observaciones').value
      };

      if (editIndex === -1) {
        // Nueva sesión
        sesionesData.push(sessionObj);
      } else {
        // Edición de sesión existente
        sesionesData[editIndex] = sessionObj;
      }

      updateUI();
      const isEditing = editIndex !== -1;
      resetForm();

      // Guardar todo el conjunto de sesiones en la nube
      syncAllToCloud(isEditing ? "Updated" : "Saved");
    });

    function editSession(index) {
      const s = sesionesData[index];
      document.getElementById('editIndex').value = index;
      document.getElementById('fecha').value = s.fecha;
      document.getElementById('nombre').value = s.nombre;
      document.getElementById('stake').value = s.stake;
      document.getElementById('horas').value = s.horas;
      document.getElementById('resultado').value = s.resultado;
      document.getElementById('observaciones').value = s.observaciones || '';

      document.getElementById('formTitle').innerText = "Edit Session";
      document.getElementById('btnSave').innerText = "Update Session";
      document.getElementById('btnCancel').style.display = "block";

      document.getElementById('pokerForm').scrollIntoView({ behavior: 'smooth' });
    }

    function deleteSession(index) {
      if (!confirm("Are you sure you want to delete this session?")) return;
      
      sesionesData.splice(index, 1);
      updateUI();
      syncAllToCloud("Deleted");
    }

    function resetForm() {
      document.getElementById('pokerForm').reset();
      document.getElementById('editIndex').value = "-1";
      document.getElementById('fecha').valueAsDate = new Date();
      document.getElementById('formTitle').innerText = "Log Session";
      document.getElementById('btnSave').innerText = "Save Session";
      document.getElementById('btnCancel').style.display = "none";
    }

    async function syncAllToCloud(actionText = "Synced") {
      document.getElementById('syncStatus').innerText = "⏳ Syncing...";
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: "OVERWRITE_ALL", data: sesionesData })
        });
        document.getElementById('syncStatus').innerText = `✅ ${actionText}`;
      } catch (err) {
        document.getElementById('syncStatus').innerText = "⚠️ Sync Error";
      }
    }

    function updateUI() {
      renderTable();
      renderStats();
      renderChart();
    }

    function renderTable() {
      const tbody = document.getElementById('tablaHistorial');
      if (sesionesData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No sessions recorded yet.</td></tr>';
        return;
      }

      // Orden inverso para mostrar las más recientes primero
      tbody.innerHTML = sesionesData.map((s, idx) => ({ s, idx })).reverse().map(({ s, idx }) => `
        <tr>
          <td>${s.fecha}</td>
          <td>${s.nombre}</td>
          <td>${s.stake}</td>
          <td>${s.horas}h</td>
          <td class="${s.resultado >= 0 ? 'positive' : 'negative'}">
            ${s.resultado >= 0 ? '+' : ''}$${s.resultado.toFixed(2)}
          </td>
          <td>${s.observaciones || '-'}</td>
          <td>
            <button class="btn-action btn-edit" onclick="editSession(${idx})">✏️</button>
            <button class="btn-action btn-delete" onclick="deleteSession(${idx})">🗑️</button>
          </td>
        </tr>
      `).join('');
    }

    function renderStats() {
      const totalSessions = sesionesData.length;
      const totalHours = sesionesData.reduce((acc, s) => acc + s.horas, 0);
      const totalProfit = sesionesData.reduce((acc, s) => acc + s.resultado, 0);
      const winrate = totalHours > 0 ? (totalProfit / totalHours) : 0;

      document.getElementById('statSesiones').innerText = totalSessions;
      document.getElementById('statHoras').innerText = totalHours.toFixed(1);
      
      const elProfit = document.getElementById('statBeneficio');
      elProfit.innerText = `${totalProfit >= 0 ? '+' : ''}$${totalProfit.toFixed(2)}`;
      elProfit.className = `stat-value ${totalProfit >= 0 ? 'positive' : 'negative'}`;

      const elWinrate = document.getElementById('statWinrate');
      elWinrate.innerText = `$${winrate.toFixed(2)}/h`;
      elWinrate.className = `stat-value ${winrate >= 0 ? 'positive' : 'negative'}`;
    }

    function renderChart() {
      const ctx = document.getElementById('bankrollChart').getContext('2d');
      
      let cumulative = 0;
      const labels = ['Start'];
      const data = [0];

      sesionesData.forEach((s, index) => {
        cumulative += s.resultado;
        labels.push(`S${index + 1}`);
        data.push(cumulative);
      });

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Bankroll ($)',
            data: data,
            borderColor: '#3b82f6',
            backgroundColor: 'rgba(59, 130, 246, 0.15)',
            borderWidth: 3,
            fill: true,
            tension: 0.2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
            y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
          }
        }
      });
    }

    async function loadSessions() {
      document.getElementById('syncStatus').innerText = "🔄 Loading...";
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        sesionesData = Array.isArray(data) ? data : [];
        updateUI();
        document.getElementById('syncStatus').innerText = "✅ Synced";
      } catch (e) {
        document.getElementById('syncStatus').innerText = "⚠️ Load Error";
      }
    }

    loadSessions();
  </script>
</body>
</html>
