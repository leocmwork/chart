<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Bankroll Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --bg-color: #0b0f17;
      --card-bg: rgba(22, 30, 46, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --accent-green: #10b981;
      --accent-green-glow: rgba(16, 185, 129, 0.3);
      --accent-red: #f43f5e;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --border-color: #1e293b;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      margin: 0;
      padding: 24px 16px;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    /* STATS DASHBOARD */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 18px 20px;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .stat-box:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stat-value {
      font-size: 1.85rem;
      font-weight: 800;
      margin-top: 6px;
      letter-spacing: -0.02em;
    }

    .positive { color: var(--accent-green); text-shadow: 0 0 20px var(--accent-green-glow); }
    .negative { color: var(--accent-red); }

    /* CHART CONTAINER */
    .chart-hero {
      position: relative;
      height: 440px;
      width: 100%;
    }

    h2 { 
      margin-top: 0; 
      font-size: 1.15rem; 
      font-weight: 700;
      color: var(--text-main); 
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    input, select {
      background-color: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent-blue);
    }

    button {
      background-color: var(--accent-blue);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover { 
      opacity: 0.95; 
      transform: translateY(-1px);
    }

    .btn-submit {
      grid-column: 1 / -1;
      margin-top: 10px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.39);
    }

    .btn-cancel {
      grid-column: 1 / -1;
      background-color: var(--border-color);
      display: none;
    }

    .btn-action {
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 6px;
      margin-right: 4px;
    }

    .btn-edit { background-color: var(--accent-purple); color: #fff; }
    .btn-delete { background-color: rgba(244, 63, 94, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    th, td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid var(--card-border);
    }

    th { 
      color: var(--text-muted); 
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. HERO CHART & STATS -->
    <div class="card">
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Total Hours</div>
          <div class="stat-value" id="statHoras">0.0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Total Profit</div>
          <div class="stat-value" id="statBeneficio">$0.00</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Winrate ($/h)</div>
          <div class="stat-value" id="statWinrate">$0.00/h</div>
        </div>
      </div>

      <div class="chart-hero" id="chartHeroArea">
        <canvas id="bankrollChart"></canvas>
      </div>
    </div>

    <!-- 2. SESSION FORM -->
    <div class="card">
      <h2 id="formTitle">📝 Log Session</h2>
      <form id="pokerForm" class="form-grid">
        <input type="hidden" id="editIndex" value="-1">
        <div class="form-group">
          <label>Session Date</label>
          <input type="date" id="fecha" required>
        </div>
        <div class="form-group">
          <label>Session Name / ID</label>
          <input type="text" id="nombre" placeholder="e.g. NL50 / PLO6" required>
        </div>
        <div class="form-group">
          <label>Stakes / Level</label>
          <input type="text" id="stake" placeholder="e.g. 0.25/0.50" required>
        </div>
        <div class="form-group">
          <label>Hours Played</label>
          <input type="number" step="0.1" id="horas" placeholder="2.5" required>
        </div>
        <div class="form-group">
          <label>Result ($)</label>
          <input type="number" step="0.01" id="resultado" placeholder="+150 or -50" required>
        </div>
        <div class="form-group" style="grid-column: 1 / -1;">
          <label>Notes / Remarks</label>
          <input type="text" id="observaciones" placeholder="Session notes...">
        </div>
        <button type="submit" id="btnSave" class="btn-submit">Save Session</button>
        <button type="button" id="btnCancel" class="btn-cancel" onclick="resetForm()">Cancel Edit</button>
      </form>
    </div>

    <!-- 3. HISTORY TABLE -->
    <div class="card">
      <h2>📊 Session History</h2>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Session</th>
              <th>Stakes</th>
              <th>Hours</th>
              <th>Result</th>
              <th>Notes</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tablaHistorial">
            <tr><td colspan="7" style="text-align:center; color: var(--text-muted);">No sessions recorded yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw5XuWVdqvhCaUFdJmc8a_Ag6yXQIHrbZ0LZYjJ2csgiESlmzfuydadVJqiviNq5cOyvA/exec";

    let chartInstance = null;
    let sesionesData = [];
    let isHovered = false;
    let animationLoopId = null;

    let globalAnimProgress = 0;
    const LOOP_DURATION = 3500;  // Tiempo de dibujado (ms)
    const PAUSE_DURATION = 1200; // Tiempo de pausa al completar (ms)

    document.getElementById('fecha').valueAsDate = new Date();

    const heroElem = document.getElementById('chartHeroArea');
    heroElem.addEventListener('mouseenter', () => isHovered = true);
    heroElem.addEventListener('mouseleave', () => isHovered = false);

    document.getElementById('pokerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const editIndex = parseInt(document.getElementById('editIndex').value);
      const sessionObj = {
        fecha: document.getElementById('fecha').value,
        nombre: document.getElementById('nombre').value,
        stake: document.getElementById('stake').value,
        horas: parseFloat(document.getElementById('horas').value),
        resultado: parseFloat(document.getElementById('resultado').value),
        observaciones: document.getElementById('observaciones').value
      };

      if (editIndex === -1) {
        sesionesData.push(sessionObj);
      } else {
        sesionesData[editIndex] = sessionObj;
      }

      updateUI();
      resetForm();

      syncAllToCloud();
    });

    function editSession(index) {
      const s = sesionesData[index];
      document.getElementById('editIndex').value = index;
      document.getElementById('fecha').value = s.fecha;
      document.getElementById('nombre').value = s.nombre;
      document.getElementById('stake').value = s.stake;
      document.getElementById('horas').value = s.horas;
      document.getElementById('resultado').value = s.resultado;
      document.getElementById('observaciones').value = s.observaciones || '';

      document.getElementById('formTitle').innerText = "✏️ Edit Session";
      document.getElementById('btnSave').innerText = "Update Session";
      document.getElementById('btnCancel').style.display = "block";

      document.getElementById('pokerForm').scrollIntoView({ behavior: 'smooth' });
    }

    function deleteSession(index) {
      if (!confirm("Are you sure you want to delete this session?")) return;
      
      sesionesData.splice(index, 1);
      updateUI();
      syncAllToCloud();
    }

    function resetForm() {
      document.getElementById('pokerForm').reset();
      document.getElementById('editIndex').value = "-1";
      document.getElementById('fecha').valueAsDate = new Date();
      document.getElementById('formTitle').innerText = "📝 Log Session";
      document.getElementById('btnSave').innerText = "Save Session";
      document.getElementById('btnCancel').style.display = "none";
    }

    async function syncAllToCloud() {
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: "OVERWRITE_ALL", data: sesionesData })
        });
      } catch (err) {
        console.error("Sync error", err);
      }
    }

    function updateUI() {
      renderTable();
      renderStats();
      renderChart();
    }

    function renderTable() {
      const tbody = document.getElementById('tablaHistorial');
      if (sesionesData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color: var(--text-muted);">No sessions recorded yet.</td></tr>';
        return;
      }

      tbody.innerHTML = sesionesData.map((s, idx) => ({ s, idx })).reverse().map(({ s, idx }) => `
        <tr>
          <td>${s.fecha}</td>
          <td style="font-weight:600;">${s.nombre}</td>
          <td><span style="background:rgba(255,255,255,0.06); padding:3px 8px; border-radius:4px; font-size:0.8rem;">${s.stake}</span></td>
          <td>${s.horas}h</td>
          <td class="${s.resultado >= 0 ? 'positive' : 'negative'}" style="font-weight:700;">
            ${s.resultado >= 0 ? '+' : ''}$${s.resultado.toFixed(2)}
          </td>
          <td style="color:var(--text-muted);">${s.observaciones || '-'}</td>
          <td>
            <button class="btn-action btn-edit" onclick="editSession(${idx})">✏️</button>
            <button class="btn-action btn-delete" onclick="deleteSession(${idx})">🗑️</button>
          </td>
        </tr>
      `).join('');
    }

    function renderStats() {
      const totalHours = sesionesData.reduce((acc, s) => acc + s.horas, 0);
      const totalProfit = sesionesData.reduce((acc, s) => acc + s.resultado, 0);
      const winrate = totalHours > 0 ? (totalProfit / totalHours) : 0;

      document.getElementById('statHoras').innerText = totalHours.toFixed(1);
      
      const elProfit = document.getElementById('statBeneficio');
      elProfit.innerText = `${totalProfit >= 0 ? '+' : ''}$${totalProfit.toFixed(2)}`;
      elProfit.className = `stat-value ${totalProfit >= 0 ? 'positive' : 'negative'}`;

      const elWinrate = document.getElementById('statWinrate');
      elWinrate.innerText = `$${winrate.toFixed(2)}/h`;
      elWinrate.className = `stat-value ${winrate >= 0 ? 'positive' : 'negative'}`;
    }

    function renderChart() {
      const ctx = document.getElementById('bankrollChart').getContext('2d');
      
      let cumulative = 0;
      const labels = ['Start'];
      const data = [0];

      sesionesData.forEach((s, index) => {
        cumulative += s.resultado;
        labels.push(`S${index + 1}`);
        data.push(cumulative);
      });

      if (chartInstance) chartInstance.destroy();
      if (animationLoopId) cancelAnimationFrame(animationLoopId);

      const isPositive = cumulative >= 0;
      const mainColor = isPositive ? '#10b981' : '#f43f5e';

      const gradient = ctx.createLinearGradient(0, 0, 0, 400);
      if (isPositive) {
        // Alto contraste y opacidad verde
        gradient.addColorStop(0, 'rgba(16, 185, 129, 0.85)');
        gradient.addColorStop(1, 'rgba(16, 185, 129, 0.35)');
      } else {
        // Alto contraste y opacidad roja
        gradient.addColorStop(0, 'rgba(244, 63, 94, 0.85)');
        gradient.addColorStop(1, 'rgba(244, 63, 94, 0.35)');
      }

      const progressiveLoopPlugin = {
        id: 'progressiveLoopPlugin',
        beforeRender(chart) {
          const { ctx } = chart;
          ctx.clearRect(0, 0, chart.width, chart.height);
        },
        beforeDatasetsDraw(chart) {
          const { ctx, chartArea } = chart;
          if (!chartArea) return;
          
          ctx.save();
          ctx.beginPath();
          const currentWidth = chartArea.left + (chartArea.width * globalAnimProgress);
          ctx.rect(0, 0, currentWidth, chart.height);
          ctx.clip();
        },
        afterDatasetsDraw(chart) {
          chart.ctx.restore();
        }
      };

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Bankroll ($)',
            data: data,
            borderColor: mainColor,
            borderWidth: 3,
            backgroundColor: gradient,
            fill: true,
            tension: 0.35,
            pointRadius: 0,       // Sin puntos visibles
            pointHoverRadius: 0  // Sin puntos al pasar el ratón
          }]
        },
        plugins: [progressiveLoopPlugin],
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#1e293b',
              titleColor: '#94a3b8',
              bodyColor: '#f8fafc',
              bodyFont: { weight: 'bold', size: 14 },
              borderColor: 'rgba(255,255,255,0.1)',
              borderWidth: 1,
              padding: 12,
              displayColors: false,
              callbacks: {
                label: function(context) {
                  return `Bankroll: $${context.parsed.y.toFixed(2)}`;
                }
              }
            }
          },
          scales: {
            x: { 
              grid: { color: 'rgba(255,255,255,0.03)', drawBorder: false }, 
              ticks: { color: '#64748b', font: { family: 'Inter', size: 11 } } 
            },
            y: { 
              grid: { color: 'rgba(255,255,255,0.05)', drawBorder: false }, 
              ticks: { 
                color: '#64748b', 
                font: { family: 'Inter', size: 11 },
                callback: function(value) { return '$' + value; }
              } 
            }
          }
        }
      });

      let totalCycleTime = LOOP_DURATION + PAUSE_DURATION;
      let startTime = null;

      function loopStep(timestamp) {
        if (!startTime) startTime = timestamp;
        let elapsed = (timestamp - startTime) % totalCycleTime;

        if (elapsed <= LOOP_DURATION) {
          let t = elapsed / LOOP_DURATION;
          globalAnimProgress = 1 - Math.pow(1 - t, 4);
        } else {
          globalAnimProgress = 1;
        }

        if (isHovered) {
          globalAnimProgress = 1;
        }

        if (chartInstance) {
          chartInstance.render();
        }

        animationLoopId = requestAnimationFrame(loopStep);
      }

      animationLoopId = requestAnimationFrame(loopStep);
    }

    async function loadSessions() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        sesionesData = Array.isArray(data) ? data : [];
        updateUI();
      } catch (e) {
        console.error("Load error", e);
      }
    }

    loadSessions();
  </script>
</body>
</html>
